# Operational priority from the classifier priority head.
# worker/app/priority/policy.py reads this file.
#
# Confidence is the maximum probability of the priority head.
# At or above the threshold, the worker stores that priority.
# Below the threshold, the worker stores the default.
#
# The threshold uses the same validation rule as config/confidence.yaml:
# the lowest candidate from 0.30 to 0.90 whose error among accepted
# priority predictions is at most 0.10. On the validation users every
# candidate qualified, so the rule keeps 0.30. At 0.30 that error is 0.027.
# Validation priority scores were all above 0.31.

default: P3
threshold: 0.30
