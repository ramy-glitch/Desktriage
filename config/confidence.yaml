# Minimum category-classifier confidence for automatic routing.
# worker/app/confidence/gate.py reads this file.
#
# Set the threshold from the validation section of
# training/notebooks/classifier_training.ipynb.
# Tickets below the threshold go to human review.
#
# Temporary stand-in until that notebook chooses a value from the validation
# split. Replace this number with that result. It is not an evaluated
# operating point. 0.5 sits in the middle of the allowed range, so a score
# can fall on either side of the gate while the classifier is still in progress.

threshold: 0.5
