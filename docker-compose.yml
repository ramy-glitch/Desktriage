# Runtime containers for Desktriage.
# api: accept an escalated ticket and return its id and status.
# worker: classify, prioritise, route, store the decision, notify the webhook.
# db: shared PostgreSQL for tickets and decisions.
# webhook: local receiver that stands in for the destination system.
#
# The exported model is copied into the worker image. Inference runs there.
# Training stays on the host.
# desktriage_common is a library copied into the images that import it.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-desktriage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desktriage}
      POSTGRES_DB: ${POSTGRES_DB:-desktriage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - desktriage

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://desktriage:desktriage@db:5432/desktriage}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - desktriage

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://desktriage:desktriage@db:5432/desktriage}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://webhook:8001/notifications}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
      webhook:
        condition: service_started
    networks:
      - desktriage

  webhook:
    build:
      context: .
      dockerfile: webhook/Dockerfile
    ports:
      - "${WEBHOOK_PORT:-8001}:8001"
    networks:
      - desktriage

volumes:
  postgres_data:

networks:
  desktriage:
    name: desktriage
